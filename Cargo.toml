[package]
name = "neko"
version = "0.1.0"
edition = "2021"
description = "Neko — self-hosted media server for anime episodes, manga and books"
license = "MIT"

[[bin]]
name = "neko"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"
argon2 = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
mime_guess = "2"
anyhow = "1"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
http-body-util = "0.1"
validator = { version = "0.18", features = ["derive"] }
rand = "0.8"
async-trait = "0.1"

[dev-dependencies]
axum-test = "15"
